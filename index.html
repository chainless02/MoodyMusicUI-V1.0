<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoodyMusicUI - V1.0</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            moody: {
              900: '#1a1a2e',
              800: '#16213e',
              700: '#0f3460',
              500: '#e94560'
            }
          },
          animation: {
            'spin-slow': 'spin 8s linear infinite',
          }
        }
      }
    }
  </script>
  <!-- Feather Icons for lightweight SVGs -->
  <script src="https://unpkg.com/feather-icons"></script>
  <style>
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: white;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div id="root" class="w-full h-full flex items-center justify-center p-4"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icon = ({ name, size = 24, className = "" }) => {
      useEffect(() => {
        if (window.feather) {
          window.feather.replace();
        }
      });
      return <i data-feather={name} width={size} height={size} className={className}></i>;
    };

    const App = () => {
      const [isPlaying, setIsPlaying] = useState(false);
      const [progress, setProgress] = useState(35);
      
      const togglePlay = () => setIsPlaying(!isPlaying);

      return (
        <div className="glass w-full max-w-sm rounded-[2rem] p-6 shadow-2xl flex flex-col items-center gap-6">
          {/* Header */}
          <div className="w-full flex justify-between items-center opacity-80">
            <button className="hover:opacity-100 transition-opacity"><Icon name="chevron-down" size={20} /></button>
            <span className="text-sm font-medium tracking-widest text-moody-500 uppercase">Now Playing</span>
            <button className="hover:opacity-100 transition-opacity"><Icon name="more-horizontal" size={20} /></button>
          </div>

          {/* Album Art */}
          <div className={`relative w-64 h-64 rounded-full overflow-hidden shadow-[0_0_40px_rgba(233,69,96,0.3)] border-4 border-moody-800 ${isPlaying ? 'animate-spin-slow' : ''} transition-all duration-500`}>
            <img 
              src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" 
              alt="Album Art" 
              className="w-full h-full object-cover"
            />
            {/* Center hole for vinyl look */}
            <div className="absolute inset-0 m-auto w-12 h-12 bg-moody-900 rounded-full border-2 border-moody-700 shadow-inner"></div>
          </div>

          {/* Track Info */}
          <div className="text-center space-y-2 mt-4">
            <h2 className="text-2xl font-bold tracking-tight">Midnight City</h2>
            <p className="text-moody-500 font-medium">Synthwave Dreams</p>
          </div>

          {/* Progress Bar */}
          <div className="w-full space-y-2">
            <div className="w-full h-1.5 bg-moody-800 rounded-full overflow-hidden cursor-pointer" onClick={(e) => {
              const rect = e.currentTarget.getBoundingClientRect();
              setProgress(((e.clientX - rect.left) / rect.width) * 100);
            }}>
              <div 
                className="h-full bg-gradient-to-r from-pink-500 to-moody-500 transition-all duration-300 relative"
                style={{ width: `${progress}%` }}
              >
                <div className="absolute right-0 top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full shadow-lg"></div>
              </div>
            </div>
            <div className="flex justify-between text-xs opacity-50 font-mono">
              <span>{Math.floor(progress / 100 * 240 / 60)}:{(Math.floor(progress / 100 * 240 % 60)).toString().padStart(2, '0')}</span>
              <span>4:00</span>
            </div>
          </div>

          {/* Controls */}
          <div className="w-full flex justify-between items-center mb-4">
            <button className="text-white/50 hover:text-white transition-colors"><Icon name="shuffle" size={20} /></button>
            <div className="flex items-center gap-6">
              <button className="text-white/80 hover:text-white transition-colors"><Icon name="skip-back" size={28} /></button>
              <button 
                onClick={togglePlay}
                className="w-16 h-16 flex items-center justify-center rounded-full bg-gradient-to-br from-moody-500 to-pink-600 shadow-[0_0_20px_rgba(233,69,96,0.4)] hover:scale-105 active:scale-95 transition-all text-white"
              >
                {isPlaying ? <Icon name="pause" size={24} /> : <Icon name="play" size={24} className="ml-1" />}
              </button>
              <button className="text-white/80 hover:text-white transition-colors"><Icon name="skip-forward" size={28} /></button>
            </div>
            <button className="text-white/50 hover:text-white transition-colors"><Icon name="repeat" size={20} /></button>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
